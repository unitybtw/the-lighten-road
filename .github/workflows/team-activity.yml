name: Update team activity

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: team-activity
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the current default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install renderer
        run: python -m pip install -r scripts/team_activity/requirements.txt
      - name: Check counting and stable updates
        run: python -m unittest discover -s scripts/team_activity -p 'test_*.py'
      - name: Refresh real contribution data and images
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/team_activity/generate.py
      - name: Publish only dashboard changes
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add README.md docs/team-activity/
          if git diff --cached --quiet; then
            echo "Team activity is unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refresh team commit activity [skip ci]'
          git push origin "HEAD:${DEFAULT_BRANCH}"
